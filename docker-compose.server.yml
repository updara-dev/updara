services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      DB_PATH: "/data/updara.db"
      CONNECTORS_DIR: "/app/connectors"
      BINARIES_DIR: "/app/binaries"
      PUBLIC_URL: "http://10.0.0.244:8080"
    volumes:
      - ./connectors:/app/connectors:ro
      - updara_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "4000:80"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

volumes:
  updara_data:
