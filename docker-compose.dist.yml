services:
  server:
    image: ghcr.io/updara-dev/updara-server:latest
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      DB_PATH: "/data/updara.db"
      CONNECTORS_DIR: "/app/connectors"
      BINARIES_DIR: "/app/binaries"
      PUBLIC_URL: "${UPDARA_PUBLIC_URL:-http://localhost:8080}"
    volumes:
      - updara_data:/data
      - updara_connectors:/app/connectors
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    image: ghcr.io/updara-dev/updara-frontend:latest
    ports:
      - "4000:80"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

volumes:
  updara_data:
  updara_connectors:
