name: docker-images
display_name: Docker Images
category: infrastructure
docs: https://docs.docker.com

vars:
  - name: DOCKER_EXCLUDE_STACKS
    description: "Comma-separated compose project names to hide (e.g. traefik,portainer)"
    required: false
    default: ""
  - name: DOCKER_EXTRA_COMPOSE_DIRS
    description: "Additional directories to scan for docker-compose.yml (comma-separated)"
    required: false
    default: ""

# Checks all running containers against Docker Hub for image updates.
# Compares local image digest with remote manifest digest.
# Auto-discovers docker-compose.yml locations for updates.
# Only supports public Docker Hub images (ghcr.io etc. are skipped silently).
check:
  type: shell
  command: |
    python3 - <<'PYEOF'
    import subprocess, json, sys, os
    try:
        from urllib.request import urlopen, Request
    except ImportError:
        print("count=0")
        sys.exit(0)

    exclude_stacks = set(s.strip() for s in os.environ.get('DOCKER_EXCLUDE_STACKS', '').split(',') if s.strip())
    extra_dirs = [d.strip() for d in os.environ.get('DOCKER_EXTRA_COMPOSE_DIRS', '').split(',') if d.strip()]

    # Auto-discover docker-compose.yml files (including Portainer-managed stacks)
    base_dirs = ['/opt', '/root', '/home', '/srv', '/docker',
                 '/var/lib/docker/volumes/portainer_portainer_data/_data/compose']
    find_result = subprocess.run(
        ['find'] + base_dirs + extra_dirs +
        ['-maxdepth', '5', '-name', 'docker-compose.yml', '-o', '-name', 'docker-compose.yaml'],
        capture_output=True, text=True
    )
    compose_dirs = list({os.path.dirname(p) for p in find_result.stdout.strip().split('\n') if p})
    for d in extra_dirs:
        if d not in compose_dirs:
            compose_dirs.append(d)

    # Check running containers for updates
    result = subprocess.run(
        ['docker', 'ps', '--format', '{{.Names}}\t{{.Image}}'],
        capture_output=True, text=True
    )
    if result.returncode != 0 or not result.stdout.strip():
        print("count=0")
        sys.exit(0)

    outdated = []
    for line in result.stdout.strip().split('\n'):
        if '\t' not in line:
            continue
        cname, image = line.split('\t', 1)

        # Skip containers from excluded stacks
        if exclude_stacks:
            project = subprocess.run(
                ['docker', 'inspect', '--format',
                 '{{index .Config.Labels "com.docker.compose.project"}}', cname],
                capture_output=True, text=True
            ).stdout.strip()
            if project in exclude_stacks:
                continue

        # Skip non-Docker-Hub images (ghcr.io, quay.io, custom registries)
        if '.' in image.split('/')[0]:
            continue

        repo, tag = (image.rsplit(':', 1) if ':' in image.split('/')[-1] else (image, 'latest'))
        if '/' not in repo:
            repo = 'library/' + repo

        try:
            token_url = f'https://auth.docker.io/token?service=registry.docker.io&scope=repository:{repo}:pull'
            token = json.loads(urlopen(token_url, timeout=10).read())['token']

            req = Request(
                f'https://registry-1.docker.io/v2/{repo}/manifests/{tag}',
                headers={
                    'Authorization': f'Bearer {token}',
                    'Accept': 'application/vnd.docker.distribution.manifest.v2+json',
                }
            )
            resp = urlopen(req, timeout=10)
            remote_digest = resp.headers.get('Docker-Content-Digest', '')

            local = subprocess.run(
                ['docker', 'inspect', '--format', '{{index .RepoDigests 0}}', image],
                capture_output=True, text=True
            ).stdout.strip()

            if remote_digest and local and remote_digest not in local:
                outdated.append(cname)
        except Exception:
            pass

    # Detect standalone containers (no com.docker.compose.project label)
    standalone = []
    for cname in outdated:
        label = subprocess.run(
            ['docker', 'inspect', '--format', '{{index .Config.Labels "com.docker.compose.project"}}', cname],
            capture_output=True, text=True
        ).stdout.strip()
        if not label:
            standalone.append(cname)

    print(f'count={len(outdated)}')
    if outdated:
        print(f'outdated={",".join(outdated)}')
    if standalone:
        print(f'standalone={",".join(standalone)}')
    if compose_dirs:
        print(f'compose_dirs={",".join(sorted(compose_dirs))}')
    PYEOF
  parse:
    count:        "$count"
    outdated:     "$outdated"
    standalone:   "$standalone"
    compose_dirs: "$compose_dirs"
  update_available: "count > 0"
  interval: 3600

update:
  type: shell
  # Auto-discovers all docker-compose.yml locations (incl. Portainer-managed volumes) and updates each stack.
  command: |
    { find /opt /root /home /srv /docker \
        -maxdepth 5 \( -name "docker-compose.yml" -o -name "docker-compose.yaml" \) 2>/dev/null; \
      find /var/lib/docker/volumes \
        -maxdepth 8 \( -name "docker-compose.yml" -o -name "docker-compose.yaml" \) 2>/dev/null; \
      if [ -n "${DOCKER_EXTRA_COMPOSE_DIRS:-}" ]; then \
        echo "$DOCKER_EXTRA_COMPOSE_DIRS" | tr ',' '\n' | while read d; do \
          [ -n "$d" ] && find "$d" -maxdepth 3 \( -name "docker-compose.yml" -o -name "docker-compose.yaml" \) 2>/dev/null; \
        done; \
      fi; \
    } | xargs -I{} dirname {} | sort -u \
      | while read dir; do
          echo "[Updara] Updating stack in $dir"
          cd "$dir" && docker compose pull && docker compose up -d
        done
  requires_confirmation: true

notifications:
  changelog: ""
