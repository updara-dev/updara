name: apt
display_name: APT Packages
icon: debian.svg
category: system
docs: https://wiki.debian.org/AptCli

vars: []  # no variables needed

check:
  type: shell
  # refresh package index first so the count reflects reality, not a stale cache
  command: "apt-get update -qq 2>/dev/null; apt list --upgradable 2>/dev/null | tail -n +2 | wc -l"
  parse:
    count: "$stdout"
  update_available: "count > 0"
  interval: 3600

update:
  type: shell
  command: "DEBIAN_FRONTEND=noninteractive apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get dist-upgrade -y -o Dpkg::Options::='--force-confold' && apt-get autoremove -y"
  requires_confirmation: true
